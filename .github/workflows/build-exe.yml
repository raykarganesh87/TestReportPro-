name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # a tag like v1.0 also creates a Release with the exe
  workflow_dispatch:        # lets you press "Run workflow" manually

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name LabReportPro --icon logo.ico --hidden-import seed --hidden-import core --hidden-import reports --hidden-import branding app.py
      - name: Save the exe
        uses: actions/upload-artifact@v4
        with:
          name: LabReportPro-exe
          path: dist/LabReportPro.exe
      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LabReportPro.exe
