name: Build Windows EXE and Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # a tag like v1.0 also creates a Release with the installer
  workflow_dispatch:        # lets you press "Run workflow" manually

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name LabReportPro --icon logo.ico --hidden-import seed --hidden-import core --hidden-import reports --hidden-import branding --hidden-import seed_lab app.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Save the installer
        uses: actions/upload-artifact@v4
        with:
          name: LabReportPro-Installer
          path: Output/LabReportPro_Setup.exe
      - name: Save the portable exe
        uses: actions/upload-artifact@v4
        with:
          name: LabReportPro-portable-exe
          path: dist/LabReportPro.exe
      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/LabReportPro_Setup.exe
            dist/LabReportPro.exe
